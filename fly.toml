# Fly.io — the paid alternative, roughly $2–3/month.
#
# Worth it over Render's free tier when you want real persistence: this
# mounts a volume, so accounts and data survive restarts and redeploys,
# and cold starts are a second or two rather than fifty.
#
# Deploy:
#   fly launch --no-deploy --name coachdesk-yourname
#   fly volumes create data --size 1 --region iad
#   fly secrets set SESSION_SECRET=$(openssl rand -hex 32)
#   fly secrets set PUBLIC_DEMO=true
#   fly deploy

app = "coachdesk"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_FILE = "/data/coachdesk.db"
  # Persistent volume below, so no ephemeral warning needed.
  EPHEMERAL_STORAGE = "false"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Scale to zero when idle to stay cheap; Fly wakes it in a second or two.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
